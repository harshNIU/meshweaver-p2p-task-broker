
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check formatting with Black
        run: python -m black --check cli tests dht tasks scripts

      - name: Lint with Ruff
        run: python -m ruff check cli tests dht tasks scripts

      - name: Audit ten independent DHT processes
        run: python -m scripts.spawn_nodes --nodes 10 --base-port 0

      - name: Exercise task routing and failover
        run: python -m scripts.routing_demo
